# Run from the repo root:  docker compose up -d --build
#
# Put the secrets below in a .env file next to this compose file (gitignored).
# Generate the 32-byte master key once (losing/changing it makes every stored
# client config unreadable):
#   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
services:
  zolltax:
    container_name: zolltax
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    volumes:
      - ./data:/data
    environment:
      PORT: 4000
      ZOLLTAX_DATA_DIR: /data
      # Required — encrypts every tenant's stored secrets at rest.
      ZOLLTAX_MASTER_KEY: ${ZOLLTAX_MASTER_KEY:?set ZOLLTAX_MASTER_KEY in .env (32-byte hex)}
      # Signs session cookies (defaults to the master key if unset).
      ZOLLTAX_SESSION_SECRET: ${ZOLLTAX_SESSION_SECRET:-}
      # Optional: seed the first admin instead of using the setup wizard.
      ZOLLTAX_ADMIN_EMAIL: ${ZOLLTAX_ADMIN_EMAIL:-}
      ZOLLTAX_ADMIN_PASSWORD: ${ZOLLTAX_ADMIN_PASSWORD:-}
      # Send the session cookie only over HTTPS — set 1 behind a TLS proxy.
      ZOLLTAX_SECURE_COOKIE: ${ZOLLTAX_SECURE_COOKIE:-}
      # Trust X-Forwarded-For for the real client IP (enable only behind a proxy).
      ZOLLTAX_TRUST_PROXY: ${ZOLLTAX_TRUST_PROXY:-}
    restart: unless-stopped
