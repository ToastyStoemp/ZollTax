# Run from the repo root:  docker compose up -d --build
#
# No .env needed to start: open the app and the first-run setup wizard creates
# the admin account and generates + persists the encryption key to /data/.env on
# the mounted volume (so it survives rebuilds). Everything below is OPTIONAL —
# set a value only to preset it / provision headlessly.
services:
  zolltax:
    container_name: zolltax
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    volumes:
      - ./data:/data
    environment:
      PORT: 4000
      ZOLLTAX_DATA_DIR: /data
      ZOLLTAX_ENV_FILE: /data/.env
      # Optional — preset the encryption key instead of letting the wizard
      # generate it (32-byte hex). Only needed for headless provisioning.
      ZOLLTAX_MASTER_KEY: ${ZOLLTAX_MASTER_KEY:-}
      # Optional — signs session cookies (defaults to the master key).
      ZOLLTAX_SESSION_SECRET: ${ZOLLTAX_SESSION_SECRET:-}
      # Optional — seed the first admin instead of using the wizard.
      ZOLLTAX_ADMIN_EMAIL: ${ZOLLTAX_ADMIN_EMAIL:-}
      ZOLLTAX_ADMIN_PASSWORD: ${ZOLLTAX_ADMIN_PASSWORD:-}
      # Send the session cookie only over HTTPS — set 1 behind a TLS proxy.
      ZOLLTAX_SECURE_COOKIE: ${ZOLLTAX_SECURE_COOKIE:-}
      # Trust X-Forwarded-For for the real client IP (enable only behind a proxy).
      ZOLLTAX_TRUST_PROXY: ${ZOLLTAX_TRUST_PROXY:-}
    restart: unless-stopped
